services:
  - type: web
    name: donde-comemos
    runtime: python
    plan: starter
    region: frankfurt
    buildCommand: python -m py_compile server.py
    startCommand: python server.py --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: off
    disk:
      name: comemos-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.9
      - key: COMEMOS_DB
        value: /var/data/comemos.sqlite3
      - key: COMEMOS_BACKUP_DIR
        value: /var/data/backups
      - key: COMEMOS_ALLOWED_EMAILS
        sync: false
      - key: COMEMOS_REGISTRATION_CODE
        generateValue: true
